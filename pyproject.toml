[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codevalidator"
version = "0.1.0"
description = "Scan a repository for backdoors, secrets, and other signs of untrustworthy (including LLM-generated) code"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.68",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mistral = ["mistralai>=2.9"]

[project.scripts]
codevalidator = "codevalidator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
