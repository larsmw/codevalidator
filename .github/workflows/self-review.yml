name: self-review

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          llm: 'false'  # heuristics only - no secrets needed, works on fork PRs too
          fail-on: 'high'
